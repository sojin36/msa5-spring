spring:
  application:
    name: msa5-spring
  web:
    error:
      include-stacktrace: never
      include-message: never

  # Mysql 접속 정보 설정
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:dbsample}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

# Mybatis 설정
mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: org.msa.msa5spring


logging:
  file:
    name: logs/error.log
  level:
    # error > warn > info > debug > trace / error레벨
    # 원래는 warning인데 info로 낮춤!
    root: warn
    org.msa.msa5spring: error
debug: false