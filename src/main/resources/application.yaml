spring:
  application:
    name: msa5-spring
  web:
    error:
      include-stacktrace: never
      include-message: never

logging:
  file:
    name: logs/error.log
  level:
    # error > warn > info > debug > trace / error레벨
    # 원래는 warning인데 info로 낮춤!
    root: warn
    org.msa.msa5spring: error
debug: false